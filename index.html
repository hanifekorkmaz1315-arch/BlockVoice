<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlockVoice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

.container {
    width: 92%;
    max-width: 430px;
    background: #151c32;
    padding: 30px 22px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #929db8;
    margin-bottom: 28px;
}

/* ANA EKRAN */

.home button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin-top: 10px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.create {
    background: #2878ff;
}

.join {
    background: #303b59;
}

input {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    outline: none;
    border-radius: 14px;
    background: #222b47;
    color: white;
    text-align: center;
    font-size: 18px;
}

/* ODA */

.room {
    display: none;
}

.player-count {
    font-size: 19px;
    margin: 20px 0 25px;
}

.room-label {
    color: #8d99b5;
    margin-bottom: 8px;
}

/* KOD + KOPYALA */

.code-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
}

.code {
    background: #222b47;
    padding: 15px 18px;
    border-radius: 14px;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #65a0ff;
}

/* YUVARLAK KOPYALA BUTONU */

.copy-button {
    width: 54px;
    height: 54px;
    min-width: 54px;
    border-radius: 50%;
    border: none;
    background: #2878ff;
    color: white;
    font-size: 25px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
}

.copy-button:active {
    transform: scale(.88);
}

.copy-button.copied {
    background: #18b66a;
}

/* MİKROFON */

.mic {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 14px;
    background: #303b59;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.mic.active {
    background: #18b66a;
}

.status {
    margin: 14px 0;
    color: #8995b2;
}

.back {
    margin-top: 15px;
    border: none;
    background: transparent;
    color: #8995b2;
    font-size: 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- ANA EKRAN -->

    <div id="home" class="home">

        <div class="logo">🎙️ BlockVoice</div>

        <div class="subtitle">
            Oyuncularla Sesli Sohbet
        </div>

        <button class="create" onclick="createRoom()">
            🏠 Oda Kur
        </button>

        <input
            id="roomInput"
            maxlength="6"
            placeholder="Oda kodu"
        >

        <button class="join" onclick="joinRoom()">
            🚪 Odaya Katıl
        </button>

        <div id="message" class="status"></div>

    </div>


    <!-- ODA EKRANI -->

    <div id="room" class="room">

        <div class="logo">🎙️ BlockVoice</div>

        <div class="subtitle">
            Sesli Sohbet Odası
        </div>

        <!-- OYUNCU SAYISI -->

        <div class="player-count">
            👥 Oyuncu: <b id="players">1</b>
        </div>


        <!-- ODA KODU -->

        <div class="room-label">
            🔑 Oda Kodu
        </div>

        <div class="code-row">

            <div id="roomCode" class="code">
                ------
            </div>

            <button
                id="copyButton"
                class="copy-button"
                onclick="copyCode()"
                title="Kopyala"
            >
                ⧉
            </button>

        </div>


        <!-- MİKROFON -->

        <button
            id="micButton"
            class="mic"
            onclick="toggleMicrophone()"
        >
            🔇 Mikrofon Kapalı
        </button>

        <div id="micStatus" class="status">
            Mikrofon kapalı
        </div>


        <!-- ÇIKIŞ -->

        <button
            class="back"
            onclick="leaveRoom()"
        >
            ← Odadan Çık
        </button>

    </div>

</div>


<script>

let currentRoom = "";
let microphone = false;
let stream = null;


/* 6 HANELİ ODA KODU */

function generateRoomCode() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code += characters[
            Math.floor(
                Math.random() * characters.length
            )
        ];

    }

    return code;
}


/* ODA KUR */

function createRoom() {

    currentRoom = generateRoomCode();

    document.getElementById("roomCode")
        .textContent = currentRoom;

    document.getElementById("players")
        .textContent = "1";

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("room")
        .style.display = "block";
}


/* ODAYA KATIL */

function joinRoom() {

    let code =
        document.getElementById("roomInput")
        .value
        .trim()
        .toUpperCase();

    if (code.length !== 6) {

        document.getElementById("message")
            .textContent =
            "⚠️ 6 karakterli kod gir.";

        return;
    }

    currentRoom = code;

    document.getElementById("roomCode")
        .textContent = currentRoom;

    document.getElementById("players")
        .textContent = "1";

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("room")
        .style.display = "block";
}


/* KODU KOPYALA */

async function copyCode() {

    try {

        await navigator.clipboard
            .writeText(currentRoom);

        const button =
            document.getElementById("copyButton");

        button.textContent = "✓";
        button.classList.add("copied");

        setTimeout(() => {

            button.textContent = "⧉";
            button.classList.remove("copied");

        }, 1500);

    } catch (error) {

        alert("Kod kopyalanamadı.");

    }
}


/* MİKROFON */

async function toggleMicrophone() {

    const button =
        document.getElementById("micButton");

    const status =
        document.getElementById("micStatus");


    if (!microphone) {

        try {

            stream =
                await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

            microphone = true;

            button.textContent =
                "🎙️ Mikrofon Açık";

            button.classList.add("active");

            status.innerHTML =
                "🟢 Konuşabilirsin";

        }

        catch (error) {

            status.textContent =
                "❌ Mikrofon izni verilmedi.";

        }

    }

    else {

        if (stream) {

            stream.getTracks()
                .forEach(track => track.stop());

            stream = null;
        }

        microphone = false;

        button.textContent =
            "🔇 Mikrofon Kapalı";

        button.classList.remove("active");

        status.textContent =
            "Mikrofon kapalı";
    }
}


/* ODADAN ÇIK */

function leaveRoom() {

    if (stream) {

        stream.getTracks()
            .forEach(track => track.stop());

        stream = null;
    }

    microphone = false;
    currentRoom = "";

    document.getElementById("room")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";

    document.getElementById("roomInput")
        .value = "";

    document.getElementById("message")
        .textContent = "";
}
/* SES AYARLARI */
const sesButonu = document.createElement("button");
sesButonu.innerHTML = "🔊";
sesButonu.style.cssText =
"width:55px;height:55px;border-radius:50%;border:0;background:#30363d;color:white;font-size:25px;margin:12px auto;display:block;";

document.getElementById("oda").appendChild(sesButonu);

const sesPenceresi = document.createElement("div");
sesPenceresi.style.cssText =
"position:fixed;bottom:90px;left:50%;transform:translateX(-50%);width:180px;padding:15px;background:#161b22;border:1px solid #30363d;border-radius:22px;text-align:center;box-shadow:0 10px 35px #000;z-index:9999;display:none;";

sesPenceresi.innerHTML = `
<button id="sesAzalt" style="font-size:25px;border:0;border-radius:50%;padding:12px;background:#30363d;color:white">🔉</button>
<button id="sesKapat" style="font-size:25px;border:0;border-radius:50%;padding:12px;background:#30363d;color:white">🔊</button>
<button id="sesArtir" style="font-size:25px;border:0;border-radius:50%;padding:12px;background:#30363d;color:white">🔊</button>
<div id="sesYuzde" style="color:white;font-size:18px;font-weight:bold;margin-top:10px">%100</div>
`;

document.body.appendChild(sesPenceresi);

let sesSeviyesi = 100;
let sesKapali = false;

sesButonu.onclick = (e) => {
  e.stopPropagation();
  sesPenceresi.style.display =
    sesPenceresi.style.display === "none" ? "block" : "none";
};

document.getElementById("sesArtir").onclick = () => {
  sesSeviyesi = Math.min(100, sesSeviyesi + 10);
  sesKapali = false;
  sesGuncelle();
};

document.getElementById("sesAzalt").onclick = () => {
  sesSeviyesi = Math.max(0, sesSeviyesi - 10);
  sesGuncelle();
};

document.getElementById("sesKapat").onclick = () => {
  sesKapali = !sesKapali;
  sesGuncelle();
};

function sesGuncelle() {
  const seviye = sesKapali ? 0 : sesSeviyesi;

  document.getElementById("sesYuzde").textContent = "%" + seviye;

  document.getElementById("sesKapat").textContent =
    sesKapali ? "🔇" : "🔊";

  document.querySelectorAll("audio").forEach(audio => {
    audio.volume = seviye / 100;
  });
}/* 🔊 BLOCKVOICE SES AYARI */

const sesAyarBtn = document.createElement("button");
sesAyarBtn.innerHTML = "🔊";
sesAyarBtn.id = "blockVoiceSesBtn";

sesAyarBtn.style.cssText = `
  width:55px;
  height:55px;
  border:0;
  border-radius:50%;
  background:#287cff;
  color:white;
  font-size:26px;
  display:block;
  margin:15px auto;
`;

document.getElementById("oda").appendChild(sesAyarBtn);

const sesMenu = document.createElement("div");

sesMenu.style.cssText = `
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  width:190px;
  padding:18px;
  background:#151c32;
  border:1px solid #394463;
  border-radius:25px;
  text-align:center;
  z-index:99999;
  box-shadow:0 10px 40px #000;
  display:none;
`;

sesMenu.innerHTML = `
  <div style="color:white;font-size:18px;font-weight:bold;margin-bottom:10px">
    🔊 Ses
  </div>

  <button id="sesYukari"
    style="width:55px;height:55px;border:0;border-radius:50%;font-size:25px;background:#303b5c;color:white">
    🔊
  </button>

  <br>

  <button id="sesMute"
    style="width:65px;height:65px;border:0;border-radius:50%;font-size:28px;background:#287cff;color:white">
    🔊
  </button>

  <br>

  <button id="sesAsagi"
    style="width:55px;height:55px;border:0;border-radius:50%;font-size:25px;background:#303b5c;color:white">
    🔉
  </button>

  <div id="sesYuzde"
    style="color:white;font-size:18px;font-weight:bold;margin-top:10px">
    %100
  </div>
`;

document.body.appendChild(sesMenu);

let blockSes = 100;
let blockMute = false;

sesAyarBtn.onclick = function(e) {
  e.stopPropagation();

  sesMenu.style.display =
    sesMenu.style.display === "none" ? "block" : "none";
};

document.getElementById("sesYukari").onclick = function() {
  blockSes = Math.min(100, blockSes + 10);
  blockMute = false;
  sesGuncelle();
};

document.getElementById("sesAsagi").onclick = function() {
  blockSes = Math.max(0, blockSes - 10);
  sesGuncelle();
};

document.getElementById("sesMute").onclick = function() {
  blockMute = !blockMute;
  sesGuncelle();
};

function sesGuncelle() {

  let ses = blockMute ? 0 : blockSes;

  document.getElementById("sesYuzde").innerText =
    "%" + ses;

  document.getElementById("sesMute").innerText =
    blockMute ? "🔇" : "🔊";

  document.querySelectorAll("audio").forEach(function(audio) {
    audio.volume = ses / 100;
  });
    }
</script>

</body>
</html>
