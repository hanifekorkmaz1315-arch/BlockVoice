plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockvoice.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blockvoice.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}
